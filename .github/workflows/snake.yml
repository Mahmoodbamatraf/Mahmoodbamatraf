name: Monochrome contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0a0a0a&color_dots=#f2f2f2,#d0d0d0,#a3a3a3,#6b6b6b,#2b2b2b
            dist/snake-dark.svg?color_snake=#f4f3ef&color_dots=#161b22,#2b2f36,#4a4f57,#8a8f96,#e6e6e3

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
